name: AutoPkg Run via CLI

on:
  # schedule:
  #   - cron: "0 0 * * *"  # Adjust schedule as needed
  workflow_dispatch:  # Enables manual triggering

jobs:
  autopkg-run:
    runs-on: macos-latest
    env:
      MUNKI_VERSION: 6.7.0
      MUNKI_EXPLICIT_VERSION: 6.7.0.4731
      APKG_VERSION: 2.7.6 # 'AUTOPKG_' gets injected as an env var
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate diffs

      - name: Ensure metadata file exists
        # needed because we'll be committing the updated metadata file to the repo after running AutoPkg
        run: |
          if [ ! -f metadata_cache.json ]; then
            echo "{}" > metadata_cache.json
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # version: "0.10.9"
          version: "0.10.10"
          enable-cache: true

      - name: Update git dependency to latest
        run: uv lock --upgrade-package cloud-autopkg-runner

      - name: Sync dependencies
        run: uv sync

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install AutoPkg
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/autopkg/autopkg/releases/download/v${{ env.APKG_VERSION }}/autopkg-${{ env.APKG_VERSION }}.pkg

      - name: Install Munki
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/munki/munki/releases/download/v${{ env.MUNKI_VERSION }}/munkitools-${{ env.MUNKI_EXPLICIT_VERSION }}.pkg

      - name: Configure AutoPkg
        run: |
          AUTOPKG_DIR="${GITHUB_WORKSPACE}/AutoPkg"
          MUNKI_DIR="${GITHUB_WORKSPACE}/Munki"

          defaults write com.github.autopkg CACHE_DIR "${AUTOPKG_DIR}/Cache"
          defaults write com.github.autopkg FAIL_RECIPES_WITHOUT_TRUST_INFO -bool TRUE
          defaults write com.github.autopkg GITHUB_TOKEN "${{ secrets.GITHUB_TOKEN }}"
          defaults write com.github.autopkg MUNKI_REPO "${MUNKI_DIR}"
          defaults write com.github.autopkg RECIPE_OVERRIDE_DIRS "${AUTOPKG_DIR}/Overrides"
          defaults write com.github.autopkg RECIPE_REPO_DIR "${AUTOPKG_DIR}/RecipeRepos"


      - name: AutoPkg Repo Add
        run: |
          cat "AutoPkg/repo_list.txt" | xargs autopkg repo-add

      - name: Debug AutoPkg settings issue
        run: |
          ## debug statements to troubleshoot missing repos in keys/values RECIPE_SEARCH_DIRS and RECIPE_REPOS
          ## These settings are set in the previous step using defaults write, but they do not seem to be picked up by
          ## AutoPkg when we run it, and the RECIPE_SEARCH_DIRS and RECIPE_REPOS keys often go missing.
          ## This is a problem because if/when AutoPkg does not pick up those settings, it throws error
          ## "Could not find parent recipe..." for each recipe in the recipe list.
          ## The following debug statements are an attempt to troubleshoot and workaround this issue and if possible, to
          ## figure out why AutoPkg is sometimes not picking up those settings.

          echo "[DEBUG] running defaults read ~/Library/Preferences/com.github.autopkg.plist > $AUTOPKG_DIR/autopkg_prefs_dump.plist"
          # This appears to work well, and shows the keys/values we set in the previous step, and it seems that AutoPkg
          # is then picking up those settings
          defaults read ~/Library/Preferences/com.github.autopkg.plist > "$AUTOPKG_DIR/autopkg_prefs_dump.plist"

          # echo "[DEBUG] running [defaults read com.github.autopkg]"
          # This appears to work and shows the keys/values we set in the previous step, and it seems that AutoPkg is then picking up those settings
          # But it does not help to show which path is being used for the plist file.  Leaving here for reference.
          # defaults read com.github.autopkg

          # echo "[DEBUG] give the system a moment or two to write the plist file after setting the defaults."
          # 2 seconds is NOT enough.
          # sleep 20

          # echo "[DEBUG] dumping content of ~/Library/Preferences/com.github.autopkg.plist"
          # does not work because the plist file is binary, but leaving here for reference
          # cat ~/Library/Preferences/com.github.autopkg.plist

          # echo "[DEBUG] dumping content of ~/Library/Preferences/com.github.autopkg.plist with plutil to convert to json for readability"
          # does not work because properly because it seems to ignore the defaults we set in the previous step, but leaving here for reference.
          # The output is missing the keys/values we set for RECIPE_SEARCH_DIRS and RECIPE_REPOS
          # plutil -convert json -r -o - ~/Library/Preferences/com.github.autopkg.plist

          # get AutoPkg to show its preferences, does NOT work because it seems to ignore the defaults we set in the previous step, but leaving here for reference
          # echo "[DEBUG] running the info subcommand with AutoPkg to show its settings"
          # autopkg info

          echo "[DEBUG] running defaults delete com.github.autopkg to make sure we're passing the AutoPkg prefs as argument instead to CAR"
          defaults delete com.github.autopkg
          # defaults read com.github.autopkg
          echo "[DEBUG] check with ls if  ~/Library/Preferences/com.github.autopkg.plist is gone now"
          ls -alh ~/Library/Preferences/com.github.autopkg.plist


      - name: Run AutoPkg
        run: |
          uv run cloud-autopkg-runner -vvv \
            --autopkg-pref-file AutoPkg/autopkg_prefs_dump.plist \
            --recipe-list AutoPkg/recipe_list.json \
            --cache-file metadata_cache.json \
            --log-file autopkg_runner.log \
            --report-dir AutoPkg/Reports/

      - name: Commit updated metadata
        # committing the metadata file to the repo is easier than using GitHub Action cache because there is no update
        # feature, see
        # https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
        # https://github.com/actions/cache/issues/342#issuecomment-2773231159
        run: |
          git add metadata_cache.json

          if git diff --cached --quiet; then
            echo "No metadata changes detected."
          else
            git commit -m "Update metadata_cache.json"
            git push
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autopkg-run-artifacts
          path: |
            AutoPkg/Cache/**/*receipt*
            AutoPkg/Reports/*
            autopkg_runner.log
            metadata_cache.json
